name: Clip Pipeline

# Конвейер нарезок strogo, evelone2004, zloyn (категория по умолчанию Grand Theft Auto VI):
# поиск клипов раз в 10 минут, очередь в ветке pipeline-state (свой файл на канал), подробная
# оценка (Whisper + Claude или метаданные), дневная подборка по каналу, монтаж.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Канал"
        type: choice
        options: [strogo, evelone2004, zloyn, evelone2004+zloyn, все каналы]
        default: strogo
      category:
        description: "Категория: название игры или all (все категории)"
        required: false
        default: "Grand Theft Auto VI"
      test:
        description: "Тест: по одному свежему клипу на канал → MP4 в артефакты, без записи состояния и лимита"
        type: boolean
        default: false
      clip_url:
        description: "Проверить конкретный клип (ссылка Twitch). Пусто — обычный поиск"
        required: false
        default: ""
      dry_run:
        description: "Отчёт об отборе без финального рендера и без записи состояния"
        type: boolean
        default: false
      force:
        description: "Пересобрать клип из clip_url, даже если он уже смонтирован"
        type: boolean
        default: false
  pull_request:
    paths:
      - "pipeline/**"
      - "tests/**"
      - ".github/workflows/clip-pipeline.yml"
      - "requirements-pipeline.txt"
      - "narezchik.py"
      - "cam_detect.py"
      - "title_card.py"
      - "scripts/find_twitch_clips.py"

permissions:
  contents: write   # ветка состояния pipeline-state

# Плановые запуски — строго друг за другом. Ручные не ставятся в эту очередь (иначе GitHub
# отменяет ожидающий запуск); от двойного монтажа защищает захват клипа в ветке состояния.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'clip-pipeline-schedule' || format('clip-pipeline-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  HYPERFRAMES_NO_TELEMETRY: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  STATE_BRANCH: ${{ github.event_name == 'pull_request' && 'pipeline-state-pr' || 'pipeline-state' }}
  STATE_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
  TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
  TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  WHISPER_MODEL: small
  WHISPER_COMPUTE: int8
  WHISPER_CACHE: /home/runner/.cache/faster-whisper
  DRAKA_ID: InquisitivePluckyZebraM4xHeh-hkkuI5RTMqe5aS8M

jobs:
  pipeline:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLIP_URL: ${{ inputs.clip_url }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      FORCE: ${{ inputs.force && 'true' || 'false' }}
      TEST: ${{ inputs.test && 'true' || 'false' }}
      # расписание — все каналы; ручной запуск — выбранный (по умолчанию strogo, как раньше)
      CHANNELS: ${{ github.event_name == 'schedule' && 'all' || (inputs.channel == 'evelone2004+zloyn' && 'new' || (inputs.channel == 'все каналы' && 'all' || inputs.channel)) }}
      CATEGORY: ${{ inputs.category == 'Grand Theft Auto VI' && 'default' || (inputs.category || 'default') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Кэш модели Whisper (тест)
        if: env.TEST == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.WHISPER_CACHE }}
          key: faster-whisper-${{ env.WHISPER_MODEL }}-v1

      - name: Тест каналов (по одному свежему клипу, без записи состояния)
        id: test
        if: env.TEST == 'true'
        run: |
          command -v ffmpeg > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; }
          python -m pip install -q -r requirements-pipeline.txt
          ch="$CHANNELS"; [ "$ch" = "strogo" ] && ch=new   # тест по умолчанию — новые каналы
          python -m pipeline.run --phase test --channels "$ch" --category "$CATEGORY" --out out

      - name: Поиск и очередь (plan)
        id: plan
        if: env.TEST != 'true'
        run: |
          args=(--phase plan --channels "$CHANNELS" --category "$CATEGORY")
          [ -n "$CLIP_URL" ] && args+=(--clip-url "$CLIP_URL")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ "$FORCE" = "true" ] && args+=(--force)
          python -m pipeline.run "${args[@]}"

      - name: Установка ffmpeg и зависимостей
        if: steps.plan.outputs.needs_work == 'true'
        run: |
          command -v ffmpeg > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; }
          python -m pip install -q -r requirements-pipeline.txt

      - name: Кэш модели Whisper
        if: steps.plan.outputs.needs_work == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.WHISPER_CACHE }}
          key: faster-whisper-${{ env.WHISPER_MODEL }}-v1

      - name: Оценка, подборка, монтаж (work)
        id: work
        if: steps.plan.outputs.needs_work == 'true'
        run: |
          # каналы из plan: при clip_url это канал владельца клипа
          args=(--phase work --channels "${{ steps.plan.outputs.channels }}" --category "$CATEGORY")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python -m pipeline.run "${args[@]}"

      - name: Готовые нарезки → артефакт
        if: always() && ((steps.work.outputs.rendered != '' && steps.work.outputs.rendered != '0') || env.TEST == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TEST == 'true' && 'test-clips' || 'clips' }}-${{ github.run_id }}
          path: |
            out/**/*.mp4
            out/**/*.srt
            out/**/*.txt
            out/**/*.json
            out/**/frames.jpg
            out/*.md
          if-no-files-found: ignore
          retention-days: 30

  # Проверка PR на реальном клипе «драка» (34,6 с): заголовок, без субтитров, MP4 в артефакте,
  # повторный плановый запуск не ставит тот же момент в монтаж. Состояние — ветка pipeline-state-pr.
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Модульные тесты отбора
        run: python -m unittest discover -s tests -v

      - name: Установка ffmpeg и зависимостей
        run: |
          command -v ffmpeg > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; }
          python -m pip install -q -r requirements-pipeline.txt

      - name: Кэш модели Whisper
        uses: actions/cache@v4
        with:
          path: ${{ env.WHISPER_CACHE }}
          key: faster-whisper-${{ env.WHISPER_MODEL }}-v1

      - name: 1) Ручной запуск на клипе «драка» (заголовок, без субтитров, проверка наготы)
        env:
          PIPELINE_MAX_EVAL: "0"     # только сам клип «драка», без посторонних кандидатов
        run: |
          url="https://www.twitch.tv/strogo/clip/$DRAKA_ID"
          python -m pipeline.run --phase plan --channels strogo --clip-url "$url" --force --out out/1
          python -m pipeline.run --phase work --channels strogo --out out/1
          python - <<'PY'
          import glob, json, os
          d = json.load(open("out/1/run_work_strogo.json"))
          cid = os.environ["DRAKA_ID"]
          assert cid in d["rendered"], f"клип не смонтирован: {d}"
          files = glob.glob(f"out/1/strogo/{cid}/*")
          assert not [f for f in files if f.endswith(".srt")], "субтитры не должны делаться"
          meta = json.load(open(f"out/1/strogo/{cid}/{cid}.json"))
          assert meta["title"].startswith("STROGO "), meta
          print("OK: MP4 с заголовком «%s», без субтитров:" % meta["title"], files)
          PY

      - name: 2) Плановый запуск не ставит тот же момент в монтаж
        env:
          PIPELINE_MAX_EVAL: "0"     # реальные новые клипы в PR-проверке не оцениваем
          PIPELINE_MAX_RENDER: "0"
        run: |
          python -m pipeline.run --phase plan --channels strogo --include-clip "$DRAKA_ID" --out out/2
          python -m pipeline.run --phase work --channels strogo --include-clip "$DRAKA_ID" --out out/2
          python - <<'PY'
          import json, os
          d = json.load(open("out/2/run_work_strogo.json"))
          cid = os.environ["DRAKA_ID"]
          assert cid in d["excluded_processed"], d
          assert cid not in d["render_queue"] and cid not in d["evaluated"], d
          print("OK: «драка» исключена как обработанная")
          PY

      - name: 3) Повторный ручной запуск без force — пропуск
        env:
          PIPELINE_MAX_EVAL: "0"
          PIPELINE_MAX_RENDER: "0"
        run: |
          python -m pipeline.run --phase plan --channels strogo --clip-url "https://www.twitch.tv/strogo/clip/$DRAKA_ID" --out out/3
          python -m pipeline.run --phase work --channels strogo --out out/3
          python - <<'PY'
          import json, os
          d = json.load(open("out/3/run_work_strogo.json"))
          cid = os.environ["DRAKA_ID"]
          assert cid in d["skipped"] and not d["rendered"], d
          print("OK: повторно не смонтирован")
          PY

      - name: 4) Тест каналов на реальных клипах — по одному новому ролику
        if: always()
        env:
          TEST_COUNT: "1"
          TEST_CHANNELS: all
          # уже выданные нарезки — не повторять ни клип, ни его момент
          EXCLUDE: >-
            InquisitivePluckyZebraM4xHeh-hkkuI5RTMqe5aS8M SparklyGoldenStarAliens-Q_P6ykSEzqYK8y8d
            BoringWimpyKleeItsBoshyTime-hL8MjYyweIzttJt8 AggressiveBetterMageDancingBaby-I2t0ObV62wt5qipQ
            PoorRockyMarjoramFrankerZ-jddvp6I_l_VqntpO SpineyCaringGarageGOWSkull-hQKeTnQ_vzkqj3Gf
            InterestingComfortableBubbleteaRaccAttack-jxMkKdm72p8fsHyS CrazyTentativeKumquatTBTacoRight-_tpJYTIWixZMFZ5x
            SavageEntertainingRadishCoolStoryBob-AIgRmpOztodkiQ7J
        run: |
          args=(--phase test --channels "$TEST_CHANNELS" --count "$TEST_COUNT" --out out/4)
          for c in $EXCLUDE; do args+=(--exclude-clip "$c"); done
          python -m pipeline.run "${args[@]}"
          python - <<'PY'
          import json
          d = json.load(open("out/4/run_test.json"))
          for ch, data in d.items():
              t = data.get("test") or {}
              ok = [c for c in t.get("clips", []) if c.get("outcome") == "ok"]
              print(ch, "→", t.get("outcome"), f"готово {len(ok)}:", *[f"\n   {c['title']} — {c['source']}" for c in ok])
              assert t.get("outcome") in ("ok", "no_clips", "source_unavailable"), f"{ch}: {t}"
          PY

      - name: Готовые нарезки → артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-check-clips
          path: |
            out/**/*.mp4
            out/**/*.srt
            out/**/*.txt
            out/**/frames.jpg
            out/**/*.md
            out/**/*.json
          if-no-files-found: warn
